  - name: Install NGINX
    ansible.builtin.package:
     name: nginx
     state: present
  - name: Start NGINX
    ansible.builtin.service:
     name: nginx
     state: started
     enabled: true
  - name: Allow HTTP traffic
    ansible.builtin.firewalld:
     service: http
     permanent: true
     immediate: true
     state: enabled
  - name: template
    ansible.builtin.template:
     src: "index.html.j2"
     dest: "/usr/share/nginx/html/index.html"
     owner: root
     group: root
     mode: '0644'
    notify: Reload nginx
